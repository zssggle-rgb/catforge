<div class="modal-mask" id="rivalEvidenceModal">
  <section class="modal price-record" role="dialog" aria-modal="true" aria-labelledby="rivalEvidenceHeading">
    <header class="modal-head price-record-head"><span id="rivalEvidenceHeading">竞品调价证据</span>
      <button class="modal-close" type="button" aria-label="关闭竞品调价证据" onclick="closeModal('rivalEvidenceModal')">×</button>
    </header>
    <div class="modal-body rival-evidence-body">
      <div class="price-record-product"><strong id="rivalEvidenceProduct"></strong>
        <span class="record-channel" id="rivalEvidenceChannel"></span>
        <span class="record-severity" id="rivalEvidenceLevel"></span>
      </div>
      <dl class="price-record-metrics">
        <div><dt>当前到手价</dt><dd id="rivalEvidencePrice">—</dd></div>
        <div><dt id="rivalEvidenceSecondLabel">上次到手价</dt><dd id="rivalEvidenceSecondValue">—</dd></div>
        <div><dt>价格变动</dt><dd id="rivalEvidenceGap">—</dd></div>
      </dl>
      <section class="price-record-observation">
        <header><b>价格记录</b><span id="rivalEvidenceMeta"></span></header>
        <div class="price-lines" id="rivalEvidenceShot"></div>
      </section>
    </div>
    <footer class="modal-foot rival-evidence-foot"><button class="btn" type="button" onclick="closeModal('rivalEvidenceModal')">关闭</button>
      <button class="btn primary" type="button" onclick="aiAskRivalPrice()">分析调价原因</button>
    </footer>
  </section>
</div>
