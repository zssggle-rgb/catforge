<div class="modal-mask" id="shareReportModal"><div class="modal" style="width:min(620px,92vw)"><div class="modal-head">分享报告 <span class="modal-close" onclick="closeModal('shareReportModal')">×</span></div><div class="modal-body">
  <div class="form-row-v3"><div class="form-field-v3"><label>访问范围</label><select class="select" id="shareScope"><option>指定人员</option><option>指定部门</option><option>公司内部</option><option>持链接可访问</option></select></div><div class="form-field-v3"><label>有效期</label><select class="select" id="shareExpiry"><option>7天</option><option>1天</option><option>30天</option><option>永久有效</option></select></div></div>
  <div class="form-field-v3"><label>接收人</label><input class="input" placeholder="输入姓名、部门或信鸿群"></div>
  <div class="form-field-v3"><label>权限设置</label><label style="margin-right:15px;font-size:11px"><input type="radio" name="sharePermission" checked> 仅查看</label><label style="margin-right:15px;font-size:11px"><input type="radio" name="sharePermission"> 可评论</label><label style="font-size:11px"><input type="radio" name="sharePermission"> 可编辑</label></div>
  <div class="form-field-v3"><label style="font-size:11px"><input type="checkbox" checked> 允许下载</label><label style="font-size:11px;margin-left:18px"><input type="checkbox"> 隐藏价格底线等敏感字段</label></div>
  <div class="subscription-note">分享记录将写入审计日志；链接到期后自动失效，可随时在报告权限中撤销。</div>
</div><div class="modal-foot"><button class="btn" onclick="closeModal('shareReportModal')">取消</button><button class="btn" onclick="copyReportLink()">复制链接</button><button class="btn primary" onclick="completeReportShare()">发送到信鸿</button></div></div></div>
